<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>컴활 1급 커플 합격 프로젝트</title>
<style>
:root{--bg:#F1F2F5;--card:#fff;--dark:#20242C;--text:#1B1E24;--soft:#6B7280;--border:#E5E7EB;--hana:#E1604A;--hyung:#2E8B80;--num:#F2B84B;--green:#2E9E6D}
*{box-sizing:border-box}html,body{margin:0}body{background:#D9DBE0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;color:var(--text)}
#app{max-width:480px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:74px}.top{padding:20px 16px 12px}.meta{font-size:12px;color:var(--soft)}h1{font-size:22px;margin:6px 0}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;display:flex;background:#fff;border-top:1px solid var(--border);padding:8px}.tabs button{flex:1;border:0;background:none;padding:12px;font-weight:700;color:#9CA3AF}.tabs button.on{color:var(--text)}
.content{padding:0 16px 24px}.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}.today{background:var(--dark);color:#fff;border:0;padding:20px}.date,.label,.sub{font-size:13px;color:#9AA1AE}.minutes{font-size:38px;font-weight:800;color:var(--num);margin:8px 0 14px}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #eee}.today .row{border:0;background:rgba(255,255,255,.06);border-radius:10px;padding:12px;margin:8px 0}.row b{font-size:14px}.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:700}.today .btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);padding:7px 11px}.primary{background:#1B1E24;color:#fff;width:100%;font-size:15px}.outline{background:#fff;border:1px solid var(--border)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#F7F8FA;border-radius:10px;padding:12px}.stat strong{display:block;font-size:20px;margin-top:4px}.title{font-size:14px;font-weight:800;color:var(--soft);margin-bottom:10px}
.progress{height:8px;background:#EBEDF1;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--num)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:20}.sheet{max-width:480px;width:100%;margin:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:20px;max-height:88vh;overflow:auto}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;color:var(--soft);margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:15px}.actions{display:flex;gap:8px}.actions .btn{flex:1}.empty{text-align:center;color:#9CA3AF;padding:30px}

.capture-note{font-size:12px;line-height:1.55;color:var(--soft);background:#F7F8FA;padding:12px;border-radius:10px;margin-bottom:12px}
.capture-box{border:1.5px dashed var(--border);border-radius:12px;padding:18px;text-align:center;background:#fff}
.capture-preview{display:block;max-width:100%;max-height:280px;object-fit:contain;margin:12px auto 0;border-radius:10px}
.copy-ok{font-size:12px;color:var(--green);margin-top:8px}

.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head button{border:1px solid var(--border);background:#fff;border-radius:9px;padding:7px 11px;font-weight:800}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-week{font-size:11px;text-align:center;color:var(--soft);padding:5px 0}
.cal-day{min-height:48px;border:1px solid var(--border);background:#fff;border-radius:9px;padding:5px;position:relative;font-size:12px;text-align:left}
.cal-day.blank{visibility:hidden}.cal-day.todaycal{box-shadow:inset 0 0 0 2px var(--num)}
.cal-dots{display:flex;gap:3px;position:absolute;left:5px;bottom:6px}
.cal-dot{width:8px;height:8px;border-radius:50%}.cal-dot.hana{background:var(--hana)}.cal-dot.hyung{background:var(--hyung)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--soft);margin:8px 0 14px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.day-detail{margin-top:12px;border-top:1px solid var(--border);padding-top:12px}.person-detail{border-left:4px solid var(--border);padding:9px 10px;margin:8px 0;background:#F7F8FA;border-radius:8px}.person-detail.hana{border-left-color:var(--hana)}.person-detail.hyung{border-left-color:var(--hyung)}
</style>
</head>
<body><div id="app"></div>
<script>
(()=>{
const KEY='cal1_couple_app_v1';
const names={hana:'유하나',hyung:'박형용'};
const subjects=['전체','컴퓨터 일반','스프레드시트 일반','데이터베이스 일반'];
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{settings:{hana:{examDate:'',weeklyGoal:4},hyung:{examDate:'',weeklyGoal:4}},readings:[],exams:[],wrongs:[],minutes:[]};
state.messages=Array.isArray(state.messages)?state.messages:[];
let tab='hana', modal=null;
let calCursor=new Date(); let selectedCalDate=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{let d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
selectedCalDate=today();
const fmt=m=>m<60?m+'분':Math.floor(m/60)+'시간'+(m%60?' '+m%60+'분':'');
const mins=(u,d=today())=>(state.minutes.find(x=>x.u===u&&x.d===d)||{}).m||0;
const readings=u=>state.readings.filter(x=>x.u===u);
const exams=u=>state.exams.filter(x=>x.u===u);
const wrongs=u=>state.wrongs.filter(x=>x.u===u);
const studyDates=u=>new Set([...readings(u).map(x=>x.d),...exams(u).map(x=>x.d)]);
function dday(u){let s=state.settings[u].examDate;if(!s)return '시험일 미설정';let a=new Date(today()),b=new Date(s),n=Math.round((b-a)/864e5);return n>0?'D-'+n:n===0?'D-Day':'D+'+Math.abs(n)}
function week(u){let now=new Date(),day=now.getDay()||7,mon=new Date(now);mon.setDate(now.getDate()-day+1);let ds=[];for(let i=0;i<7;i++){let d=new Date(mon);d.setDate(mon.getDate()+i);ds.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`)}let set=studyDates(u),done=ds.filter(d=>set.has(d)).length,goal=state.settings[u].weeklyGoal||4,mm=ds.reduce((s,d)=>s+mins(u,d),0);return{done,goal,pct:Math.round(done/goal*100),mm}}
function home(u){
 let w=week(u),r=readings(u),e=exams(u),wr=wrongs(u),rt=r.reduce((s,x)=>s+x.count,0),latest=e[e.length-1],rate=latest?Math.round(latest.correct/latest.total*1000)/10:'-';
 return `<div class="top"><div class="meta">컴활 1급 · 필기</div><h1>${names[u]} <span style="float:right;font-size:13px">${dday(u)}</span></h1></div><div class="content">
 <div class="card today"><div class="date">${today()}</div><b>오늘의 공부</b><div class="minutes">${fmt(mins(u))}</div>
 <div class="row"><span>필기 요약본 회독</span><button class="btn" onclick="openM('reading')">+ 기록</button></div>
 <div class="row"><span>기출</span><button class="btn" onclick="openM('exam')">+ 기록</button></div>
 <div class="row"><span>오답</span><button class="btn" onclick="openM('wrong')">+ 등록</button></div>
 <div class="row"><span>오늘 총 공부시간</span><button class="btn" onclick="openM('minutes')">시간 설정</button></div></div>
 <div class="card"><div class="title">이번 주 목표 · 매주 변경 가능</div>
 <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
   <div style="font-size:22px;font-weight:800">${w.done} / ${w.goal}회</div>
   <button class="btn outline" style="padding:8px 12px" onclick="openWeeklyGoal()">목표 변경</button>
 </div>
 <div class="progress" style="margin-top:10px"><div class="fill" style="width:${Math.min(100,w.pct)}%"></div></div>
 <div class="sub" style="margin-top:8px">달성률 ${w.pct}% · 이번 주 ${fmt(w.mm)}</div></div>
 <div class="card"><div class="title">누적 현황</div><div class="grid">
 <div class="stat"><span class="sub">요약본 누적</span><strong>${rt}회독</strong></div><div class="stat"><span class="sub">최근 기출</span><strong>${rate}${rate==='-'?'':'%'}</strong></div>
 <div class="stat"><span class="sub">오답</span><strong>${wr.length}개</strong></div><div class="stat"><span class="sub">누적 공부시간</span><strong>${fmt(state.minutes.filter(x=>x.u===u).reduce((s,x)=>s+x.m,0))}</strong></div></div></div>
 <div class="card"><div class="title">설정</div><div class="field"><label>필기 시험일</label><input type="date" id="examDate" value="${state.settings[u].examDate||''}"></div><div class="field"><label>이번 주 공부 목표 횟수</label><input type="number" id="goal" min="1" max="7" value="${state.settings[u].weeklyGoal||4}"></div><button class="btn primary" onclick="saveSettings()">설정 저장</button></div>
 </div>`;
}

function hasStudy(u,d){return readings(u).some(x=>x.d===d)||exams(u).some(x=>x.d===d)||wrongs(u).some(x=>x.d===d)||mins(u,d)>0}
function daySummary(u,d){
 let rr=readings(u).filter(x=>x.d===d).reduce((a,x)=>a+x.count,0);
 let ee=exams(u).filter(x=>x.d===d);
 let ww=wrongs(u).filter(x=>x.d===d);
 let parts=[];
 if(rr)parts.push(`요약본 ${rr}회독`);
 ee.forEach(x=>parts.push(`기출 ${x.year}년 ${x.round}회 · ${x.total}문제 / 오답 ${x.wrongCount??(x.total-x.correct)}개 · ${x.total?((x.correct/x.total)*100).toFixed(1):0}%`));
 if(ww.length)parts.push(`오답노트 ${ww.length}개`);
 let mm=mins(u,d);if(mm)parts.push(`공부시간 ${fmt(mm)}`);
 return parts;
}
function calendarHtml(){
 let y=calCursor.getFullYear(),m=calCursor.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0);
 let blanks=first.getDay(),cells='',weeks=['일','월','화','수','목','금','토'];
 for(let i=0;i<blanks;i++)cells+='<div class="cal-day blank"></div>';
 for(let day=1;day<=last.getDate();day++){
   let d=`${y}-${pad(m+1)}-${pad(day)}`,h=hasStudy('hana',d),f=hasStudy('hyung',d);
   cells+=`<button class="cal-day ${d===today()?'todaycal':''}" onclick="selectCal('${d}')"><b>${day}</b><span class="cal-dots">${h?'<i class="cal-dot hana"></i>':''}${f?'<i class="cal-dot hyung"></i>':''}</span></button>`;
 }
 let detail='';
 if(selectedCalDate && selectedCalDate.startsWith(`${y}-${pad(m+1)}`)){
   let hs=daySummary('hana',selectedCalDate),fs=daySummary('hyung',selectedCalDate);
   detail=`<div class="day-detail"><b>${selectedCalDate} 공부 기록</b>
   <div class="person-detail hana"><b>유하나</b><div class="sub" style="margin-top:5px">${hs.length?hs.join('<br>'):'공부 기록 없음'}</div></div>
   <div class="person-detail hyung"><b>박형용</b><div class="sub" style="margin-top:5px">${fs.length?fs.join('<br>'):'공부 기록 없음'}</div></div></div>`;
 }
 return `<div class="card"><div class="title">우리 공부 캘린더</div><div class="legend"><span><i style="background:var(--hana)"></i>유하나</span><span><i style="background:var(--hyung)"></i>박형용</span></div>
 <div class="cal-head"><button onclick="moveCal(-1)">‹</button><b>${y}년 ${m+1}월</b><button onclick="moveCal(1)">›</button></div>
 <div class="cal-grid">${weeks.map(w=>`<div class="cal-week">${w}</div>`).join('')}${cells}</div>${detail}</div>`;
}
window.moveCal=n=>{calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()+n,1);selectedCalDate=`${calCursor.getFullYear()}-${pad(calCursor.getMonth()+1)}-01`;render()}
window.selectCal=d=>{selectedCalDate=d;render()}
function together(){
 let a=week('hana'),b=week('hyung');
 let msgs=state.messages.slice().reverse();
 return `<div class="top"><div class="meta">컴활 1급</div><h1>우리의 합격 프로젝트</h1></div><div class="content">
 ${calendarHtml()}
 <div class="card"><div class="title">이번 주 비교</div><div class="row"><b>유하나</b><span>${a.done}/${a.goal}회 · ${fmt(a.mm)}</span></div><div class="row"><b>박형용</b><span>${b.done}/${b.goal}회 · ${fmt(b.mm)}</span></div></div>
 <div class="card"><div class="title">누적 기록</div><div class="row"><b>유하나</b><span>요약본 ${readings('hana').reduce((s,x)=>s+x.count,0)}회독 · 기출 ${exams('hana').length} · 오답 ${wrongs('hana').length}</span></div><div class="row"><b>박형용</b><span>요약본 ${readings('hyung').reduce((s,x)=>s+x.count,0)}회독 · 기출 ${exams('hyung').length} · 오답 ${wrongs('hyung').length}</span></div></div>
 <div class="card"><div class="title">서로 힘내라고 한마디</div>
 <div class="field"><label>작성자</label><select id="msgAuthor"><option value="hana">유하나</option><option value="hyung">박형용</option></select></div>
 <div class="field"><label>메시지</label><textarea id="msgText" placeholder="오늘도 같이 힘내자!"></textarea></div>
 <button class="btn primary" onclick="saveMessage()">메시지 남기기</button>
 <div style="margin-top:14px">${msgs.length?msgs.map(m=>`<div class="stat" style="margin-bottom:8px"><b>${names[m.u]}</b><span class="sub" style="float:right">${m.d}</span><div style="margin-top:7px;white-space:pre-wrap">${escapeHtml(m.text)}</div></div>`).join(''):'<div class="empty">아직 남긴 메시지가 없어요.</div>'}</div>
 </div></div>`;
}
function escapeHtml(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.saveMessage=()=>{let u=document.getElementById('msgAuthor').value,text=document.getElementById('msgText').value.trim();if(!text){alert('메시지를 입력해 주세요.');return}state.messages.push({u,d:today(),text,createdAt:Date.now()});save();render()}
function render(){document.getElementById('app').innerHTML=(tab==='together'?together():home(tab))+`<div class="tabs"><button class="${tab==='hana'?'on':''}" onclick="go('hana')">유하나</button><button class="${tab==='together'?'on':''}" onclick="go('together')">같이보기</button><button class="${tab==='hyung'?'on':''}" onclick="go('hyung')">박형용</button></div>`+(modal||'')}
window.go=t=>{tab=t;modal=null;render()}
window.openM=t=>{if(tab==='together')return;let body='';
 if(t==='reading')body=`<h3>필기 요약본 회독</h3><div class="capture-note">20페이지 요약본을 오늘 몇 회독했는지만 기록해요.</div><div class="field"><label>오늘 회독 횟수</label><input id="count" type="number" min="1" value="1"></div><button class="btn primary" onclick="saveReading()">저장</button>`;
 if(t==='exam')body=`<h3>기출 기록</h3><div class="field"><label>연도</label><input id="year" type="number" value="${new Date().getFullYear()-2}"></div><div class="field"><label>회차</label><input id="round" type="number" value="1"></div><div class="field"><label>총 문제 수</label><input id="total" type="number" value="60"></div><div class="field"><label>오답 개수</label><input id="wrongCount" type="number" min="0" value="0"></div><div class="capture-note">저장하면 정답 수와 정답률을 자동 계산하고, 오답이 있으면 바로 오답노트 등록 화면으로 넘어가요.</div><button class="btn primary" onclick="saveExam()">저장하고 다음</button>`;
 if(t==='wrong')body=`<h3>오답 등록</h3><div class="field"><label>문제번호</label><input id="q" placeholder="예: 12"></div><div class="field"><label>과목</label><select id="wsubj">${subjects.slice(1).map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label>메모</label><textarea id="memo"></textarea></div><button class="btn primary" onclick="saveWrong()">직접 입력해서 저장</button><button class="btn outline" style="width:100%;margin-top:8px" onclick="openCapture()">📷 오답 캡처로 등록</button>`;
 if(t==='minutes')body=`<h3>공부시간 설정</h3><div class="field"><label>분</label><input id="mm" type="number" min="0" value="${mins(tab)}"></div><button class="btn primary" onclick="saveMinutes()">저장</button>`;
 modal=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="sheet">${body}<button class="btn outline" style="width:100%;margin-top:8px" onclick="closeM()">닫기</button></div></div>`;render()}
window.closeM=()=>{modal=null;render()}
window.saveReading=()=>{state.readings.push({u:tab,d:today(),subject:'필기 요약본',count:+document.getElementById('count').value||1});save();closeM()}
window.saveExam=()=>{let total=+document.getElementById('total').value||60,wc=Math.max(0,+document.getElementById('wrongCount').value||0);wc=Math.min(total,wc);let correct=total-wc,year=+document.getElementById('year').value,round=+document.getElementById('round').value;state.exams.push({u:tab,d:today(),year,round,total,correct,wrongCount:wc});save();if(wc>0){openWrongAfterExam(year,round,wc)}else{closeM()}}
window.saveWrong=()=>{state.wrongs.push({u:tab,d:today(),question:document.getElementById('q').value,subject:document.getElementById('wsubj').value,memo:document.getElementById('memo').value});save();closeM()}
window.saveMinutes=()=>{let x=state.minutes.find(x=>x.u===tab&&x.d===today()),m=Math.max(0,+document.getElementById('mm').value||0);x?x.m=m:state.minutes.push({u:tab,d:today(),m});save();closeM()}
window.saveSettings=()=>{state.settings[tab].examDate=document.getElementById('examDate').value;state.settings[tab].weeklyGoal=Math.max(1,Math.min(7,+document.getElementById('goal').value||4));save();render()}


window.openWrongAfterExam=(year,round,wc)=>{
 modal=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="sheet">
 <h3>오답노트 등록</h3>
 <div class="capture-note">${year}년 ${round}회 · 오답 ${wc}개가 기록됐어요.<br>바로 오답노트를 등록해 주세요.</div>
 <button class="btn primary" onclick="openM('wrong')">직접 입력</button>
 <button class="btn outline" style="width:100%;margin-top:8px" onclick="openCapture()">📷 오답 캡처로 등록</button>
 <button class="btn outline" style="width:100%;margin-top:8px" onclick="closeM()">나중에 등록</button>
 </div></div>`;render()
}

window.openWeeklyGoal=()=>{
 let current=state.settings[tab].weeklyGoal||4;
 modal=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="sheet">
 <h3>이번 주 공부 목표</h3>
 <div class="capture-note">이번 주 상황에 맞춰 목표 횟수를 바꿀 수 있어요. 유하나와 박형용은 각각 따로 설정됩니다.</div>
 <div class="field"><label>이번 주 목표 횟수</label><input id="weeklyGoalInput" type="number" min="1" max="7" value="${current}"></div>
 <button class="btn primary" onclick="saveWeeklyGoal()">이번 주 목표 저장</button>
 <button class="btn outline" style="width:100%;margin-top:8px" onclick="closeM()">취소</button>
 </div></div>`;render()
}
window.saveWeeklyGoal=()=>{
 let v=Math.max(1,Math.min(7,+document.getElementById('weeklyGoalInput').value||1));
 state.settings[tab].weeklyGoal=v;save();closeM()
}
window.openCapture=()=>{
 modal=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="sheet">
 <h3>📷 오답 캡처로 등록</h3>
 <div class="capture-note"><b>사용 방법</b><br>① 아래에서 오답 캡처 선택 → ② 분석 요청문 복사 → ③ ChatGPT에 캡처와 요청문을 같이 보내기 → ④ 받은 결과를 아래 칸에 붙여넣기 → ⑤ 자동 등록</div>
 <div class="capture-box"><label class="btn outline" for="capFile">이미지 선택</label><input id="capFile" type="file" accept="image/*" style="display:none" onchange="previewCapture(this)"><img id="capPreview" class="capture-preview" style="display:none"></div>
 <button class="btn outline" style="width:100%;margin-top:10px" onclick="copyCapturePrompt()">ChatGPT 분석 요청문 복사</button>
 <div id="copyMsg" class="copy-ok"></div>
 <div class="field"><label>ChatGPT 분석 결과 붙여넣기</label><textarea id="analysis" rows="9" placeholder="문제번호: 12&#10;과목: 컴퓨터 일반&#10;틀린 이유: 개념 모름&#10;핵심 개념: ...&#10;메모: ..."></textarea></div>
 <button class="btn primary" onclick="importAnalysis()">분석 결과 자동 등록</button>

}
window.previewCapture=input=>{
 let f=input.files&&input.files[0]; if(!f)return;
 let r=new FileReader(); r.onload=e=>{let img=document.getElementById('capPreview');if(img){img.src=e.target.result;img.style.display='block'}};r.readAsDataURL(f)
}
window.copyCapturePrompt=async()=>{
 let prompt=`이 컴퓨터활용능력 1급 필기 CBT 오답 캡처 이미지를 분석해줘.
이미지에 보이는 오답 문제마다 아래 형식을 정확히 반복해서 출력해줘.

문제번호: 숫자
과목: 컴퓨터 일반 / 스프레드시트 일반 / 데이터베이스 일반 중 하나
틀린 이유: 개념 모름 / 헷갈림 / 암기 부족 / 문제 잘못 읽음 / 단순 실수 중 하나
핵심 개념: 시험 복습에 필요한 내용을 한 줄로
메모: 다시 풀 때 기억해야 할 핵심

문제가 여러 개면 문제 사이를 빈 줄 하나로 구분해줘.
이미지에서 확실하지 않은 내용은 추측하지 말고 "확인 필요"라고 적어줘.
설명이나 머리말 없이 위 형식의 결과만 출력해줘.`;
 try{await navigator.clipboard.writeText(prompt);document.getElementById('copyMsg').textContent='✓ 요청문이 복사됐어요. 이 캡처와 함께 ChatGPT에 붙여넣어 주세요.'}
 catch(e){promptFallback(prompt)}
}
function promptFallback(text){let ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();let m=document.getElementById('copyMsg');if(m)m.textContent='✓ 요청문이 복사됐어요.'}
function parseBlocks(text){
 let starts=[...text.matchAll(/문제번호\s*[:：]/g)].map(x=>x.index); if(!starts.length)return[];
 return starts.map((s,i)=>text.slice(s,starts[i+1]??text.length).trim()).map(block=>{
   let get=label=>{let m=block.match(new RegExp(label+'\\\\s*[:：]\\\\s*(.*)'));return m?m[1].trim():''};
   return {question:get('문제번호').replace(/[^0-9]/g,''),subject:get('과목')||'확인 필요',reason:get('틀린 이유')||'확인 필요',concept:get('핵심 개념')||'',memo:get('메모')||''}
 }).filter(x=>x.question)
}
window.importAnalysis=()=>{
 let items=parseBlocks(document.getElementById('analysis').value);
 if(!items.length){alert('문제번호를 찾지 못했어요. ChatGPT 결과 형식을 확인해 주세요.');return}
 items.forEach(x=>state.wrongs.push({u:tab,d:today(),question:x.question,subject:x.subject,reason:x.reason,concept:x.concept,memo:x.memo}));
 save();alert(items.length+'개의 오답을 등록했어요.');closeM()
}
render();
})();
</script></body></html>
